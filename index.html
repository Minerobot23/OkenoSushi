<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Okeno Sushi | Sushi &amp; Japanese food on Glen Drive, Shirley, NY</title>
    <meta
      name="description"
      content="Okeno Sushi at 451 Glen Drive, Shirley, NY: sushi, sashimi, special rolls, bento and kitchen dishes. Browse the menu, order online for pickup, or call (631) 668-8188."
    />
    <meta name="theme-color" content="#171A17" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="restaurant" />
    <meta property="og:title" content="Okeno Sushi · Shirley, NY" />
    <meta property="og:description" content="Sushi, sashimi, and Japanese favorites on Glen Drive." />
    <meta property="og:image" content="/images/dishes/ordering-sushi-sashimi-combo-for-2.jpg" />
    <link rel="preload" as="image" href="/images/counter-600.jpg" />
    <script>
      // Before first paint: switch to the scene layout, show the scene named in the URL, and start
      // the noren arrival. index.html ends the arrival on a timer even if no script below runs
      // (Cinematic Demo Playbook: nothing waits on an animation). Reduced motion skips it.
      (function () {
        var d = document.documentElement;
        var ids = ["counter", "menu", "platters", "gallery", "visit"];
        var h = location.hash.slice(1);
        d.classList.add("js");
        d.setAttribute("data-scene", ids.indexOf(h) >= 0 ? h : "counter");
        // Until the app takes over (window.__okeno), links to a scene still switch it.
        window.addEventListener("hashchange", function () {
          var id = location.hash.slice(1);
          if (!window.__okeno && ids.indexOf(id) >= 0) d.setAttribute("data-scene", id);
        });
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          d.classList.add("arrive");
          setTimeout(function () {
            d.classList.remove("arrive");
          }, 2900);
        }
      })();
    </script>
    <!--structured-data-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
